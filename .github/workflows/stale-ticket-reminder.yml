name: Stale ticket reminder

on:
  schedule:
    # Every hour from 7:00 AM to 6:00 PM Philippine time (UTC+8)
    # 7 AM PH = 23:00 UTC (previous day), 8 AM-6 PM PH = 00:00-10:00 UTC
    - cron: '0 23 * * *'
    - cron: '0 0-10 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node stale-reminder.js
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
