
name: Stale ticket reminder

on:
  schedule:
    # 7:00 AM Philippine time
    - cron: '0 23 * * *'

    # 8:00 AM to 6:00 PM Philippine time
    - cron: '0 0-10 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify updated reminder script
        run: |
          test -f stale-reminder.js
          grep -q 'stale-filter-v3-allowlist' stale-reminder.js

      - name: Run stale ticket reminder
        run: node stale-reminder1.js
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          STALE_DAYS: '2'
          DRY_RUN: 'true'
