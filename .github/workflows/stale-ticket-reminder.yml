
name: Stale ticket reminder

on:
  # Every hour from 7:15 AM to 6:15 PM Philippine time
  # GitHub Actions cron uses UTC
  schedule:
    - cron: '15 23 * * *'
    - cron: '15 0-10 * * *'

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping reminder runs
concurrency:
  group: stale-ticket-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify reminder script
        run: |
          test -f stale-reminder1.js || {
            echo 'Missing stale-reminder1.js'
            exit 1
          }
          node --check stale-reminder1.js
          echo "Commit: $GITHUB_SHA"
          sha256sum stale-reminder1.js

      - name: Send stale ticket reminders
        run: node stale-reminder1.js
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          STALE_DAYS: '2'
          DRY_RUN: 'false'
