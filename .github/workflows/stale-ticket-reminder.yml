name: Stale ticket reminder

on:
  schedule:
    # Every hour from 7:07 AM to 6:07 PM Philippine time (UTC+8)
    # 7:07 AM PH = 23:07 UTC (previous day), 8:07 AM-6:07 PM PH = 00:07-10:07 UTC
    - cron: '7 23 * * *'
    - cron: '7 0-10 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node stale-reminder.js
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
